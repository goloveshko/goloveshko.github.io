name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      # Stage only production assets — exclude node_modules, lockfile, README, and input.css
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'docker-compose.yml' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude 'css/input.css' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0