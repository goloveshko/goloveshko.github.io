name: Build Tailwind CSS

on:
  push:
    branches: [main] # verify with: git branch --show-current
    paths:
      - "index.html"
      - "css/input.css"
      - "js/**/*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-tailwind.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tailwind
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/tailwind.css
          if git diff --cached --quiet; then
            echo "css/tailwind.css is up to date — nothing to commit"
          else
            git commit -m "chore: rebuild tailwind.css [skip ci]"
            git push
          fi